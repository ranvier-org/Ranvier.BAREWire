name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: BAREWire (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [dotnet, fable, aot]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('**/*.fsproj', '**/Directory.Build.*', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.group }}-
      - name: Run the same checks as local development
        run: dotnet fsi build.fsx -- test --group ${{ matrix.group }}

  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Pack untraced and traced packages with Fable sources and check them
        run: dotnet fsi build.fsx -- pack
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: bin/*.nupkg
          if-no-files-found: error

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet fsi build.fsx -- tools
      - run: dotnet fsi build.fsx -- format --dry-format --quick

  # The vendored files against BAREWire's repository at the commit VENDORED.md records. It reads another host, so it
  # is reported beside the result and is not part of it: an outage of that host must not block a release.
  vendored:
    name: Vendored BAREWire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare the vendored files with the recorded commit
        shell: pwsh
        run: ./scripts/vendor-barewire.ps1 -Check

  result:
    name: CI result
    needs: [checks, packages, format]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success) ;; *) exit 1 ;; esac
          done
